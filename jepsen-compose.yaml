name: jepsen

x-defaults: &defaults
  privileged: true
  cap_add:
    - ALL
  cgroup: host
  tty: true
  stop_signal: SIGRTMIN+3
  tmpfs:
    - /run:size=100M
    - /run/lock:size=100M
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - ../state/jepsen-shared:/var/jepsen/shared
  networks:
    - jepsen
  healthcheck:
    test: ["CMD-SHELL", "systemctl", "is-system-running"]
    interval: 1s
    timeout: 1s
    start_period: 1s
    start_interval: 1s
    retries: 15

x-node: &default-node
  <<: *defaults
  image: ${JEPSEN_REGISTRY:-}jepsen-node
  depends_on:
    setup:
      condition: service_completed_successfully

networks:
  jepsen:

services:
  # cAdvisor is intentionally disabled in this macOS/Docker Desktop workflow.
  # The container-level memory figures were misleading here, so we rely on
  # `docker stats` via `./scripts/monitor-etcd-run.sh resource-stats` instead.
  # cadvisor:
  #   image: gcr.io/cadvisor/cadvisor:v0.49.1
  #   container_name: jepsen-cadvisor
  #   ports:
  #     - 8081:8080
  #   volumes:
  #     - /:/rootfs:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /var/run:/var/run:rw
  #     - /sys:/sys:ro
  #     - /var/lib/docker:/var/lib/docker:ro
  #     - /dev/disk:/dev/disk:ro
  #   privileged: true

  setup:
    <<: *defaults
    image: ${JEPSEN_REGISTRY:-}jepsen-setup
    container_name: jepsen-setup
    hostname: setup
    entrypoint: ["/usr/local/bin/jepsen-setup.sh"]

  control:
    <<: *defaults
    image: ${JEPSEN_REGISTRY:-}jepsen-control
    container_name: jepsen-control
    hostname: control
    mem_limit: 14g
    ports:
      - 22
      - 8080
    depends_on:
      n1:
        condition: service_healthy
      n2:
        condition: service_healthy
      n3:
        condition: service_healthy
      n4:
        condition: service_healthy
      n5:
        condition: service_healthy
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../state/jepsen-shared:/var/jepsen/shared
      - ../runs:/var/jepsen/runs
      - ../jepsen-etcd:/jepsen/etcd

  n1:
    <<: *default-node
    container_name: jepsen-n1
    hostname: n1
  n2:
    <<: *default-node
    container_name: jepsen-n2
    hostname: n2
  n3:
    <<: *default-node
    container_name: jepsen-n3
    hostname: n3
  n4:
    <<: *default-node
    container_name: jepsen-n4
    hostname: n4
  n5:
    <<: *default-node
    container_name: jepsen-n5
    hostname: n5
